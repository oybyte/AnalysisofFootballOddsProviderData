    - rule-atom-10b47a97941244745803cd00
    - rule-atom-017b51b5f6a6b76fa7973954
    - rule-atom-ecaa72fdd66d27214f732872
    evaluator:
      kind: manual_review
      config:
        question: 确认胜平负、让球、总进球和比分是否各自引用直接证据；总进球缺少直接合格时序时记录 insufficient_data，不得由凯利、让球或胜负结论补造区间或比分。
    required_inputs: [market_evidence_refs, total_goals_direct_series, market_statuses]
    time_gate: prematch
    failure_mode: insufficient_data
    thresholds: {}
    counter_evidence_requirements: [direct_total_goals_evidence, independent_market_statuses]
    invalidation_conditions: [存在跨市场推导, 总进球直接证据不足, 市场状态冲突]
    precedence:
      override_mode: none
      supersedes_rule_ids: []
      override_scope: none
  merge_reason: 将凯利、让球和比分的跨市场认知边界收敛为单一人工隔离检查，不产生市场方向。
