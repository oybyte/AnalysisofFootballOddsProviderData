evaluator:
  kind: manual_review
  config:
    question: '- 适用场景：赛前 2 小时内的临盘水位异动判定。

      - 触发条件：盘口档位不变，水位在正负 0.08 区间内反复横跳，无明确单边走势，作为中浅盘基准值。

      - 判定逻辑：属于多空资金正常博弈，机构核心态度未发生变化，不具备方向指示意义，属于市场噪音。

      - 执行动作：维持赛前核心结论，不随短期水位波动频繁调仓，忽略窄幅震荡信号。

      - 场景校准：深盘（一球及以上）阈值收窄至正负 0.05；低流动性联赛阈值放宽至正负 0.10。'
required_inputs:
- human_review
time_gate: prematch
failure_mode: insufficient_data
thresholds: {}
counter_evidence_requirements: []
invalidation_conditions:
- 缺少赛前可追溯输入
