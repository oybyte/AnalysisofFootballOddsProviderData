schema_version: 1
rule_id: advisory-intake-cefcc8603b90
rule_revision: 1
track: advisory
effect: advisory
official_effect: none
market_scope: cross_market
applies_to_profiles:
- global
source_atoms:
- rule-atom-0f703cae3e0dcefcc8603b90
evaluator:
  kind: manual_review
  config:
    question: '- 适用场景：欧冠 / 欧联资格赛、洲际杯赛等不同联赛层级球队对阵的场次。

      - 触发条件：将低级别联赛球队的内战连胜、连续零封等战绩，作为对阵高级别联赛球队的核心支撑逻辑时。

      - 判定逻辑：小联赛或低级别联赛的内战战绩，面对更高层级联赛对手时，防守韧性、进攻效率需做折价处理；不得直接将内战战绩平移作为爆冷或赢盘的核心依据。

      - 执行动作：弱势方的防守或进攻战绩权重下调一级，不得仅凭“连续零封”“连胜”判定其具备抗衡顶级联赛球队的能力。'
required_inputs:
- human_review
time_gate: prematch
failure_mode: insufficient_data
thresholds: {}
counter_evidence_requirements: []
invalidation_conditions:
- 缺少赛前可追溯输入
precedence:
  override_mode: none
  supersedes_rule_ids: []
  override_scope: none
