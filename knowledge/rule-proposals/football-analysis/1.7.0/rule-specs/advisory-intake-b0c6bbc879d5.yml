    question: 边界衔接：若同时存在冷门正向上调信号与反向修正信号，先按幅度做等额抵消，剩余净幅度按保守侧档位生效，不双向重复计算；三项凯利处于平权区间，或冷门与热门凯利差值≤0.05时，不触发本反向修正规则；反向修正后，冷门权重最低下调至初始基线水平，不得低于基线；凯利上行幅度统一采用“初盘至赛前2小时稳定盘”的标准口径。
