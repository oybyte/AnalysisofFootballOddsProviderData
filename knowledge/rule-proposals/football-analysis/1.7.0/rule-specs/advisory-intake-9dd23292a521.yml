evaluator:
  kind: manual_review
  config:
    question: '1. 盘口先从初始档位升一级（如半一→1球、半球→半一），升盘后上盘水位较升盘前阶段低点累计涨幅≥0.15，呈现标准的“升盘升水”诱盘形态；

      2. 临场24小时内，盘口退回升盘前的初始档位（如1球→半一），退盘后上盘水位同步降至≤0.90的中水及以下区间；

      3. 退盘后下盘水位未出现单边累计降幅≥0.10的持续下滑，排除真实诱下的可能性。'
required_inputs:
- human_review
