evaluator:
  kind: manual_review
  config:
    question: '1. 碾压式大球：2.5 大球长期不高于 0.50、热门方深盘阻上、平凯利最低三项同时满足；用户原文给出 3-5 球主区间和 6 球尾部候选。

      2. 客场崩盘：客队客场防守倒数且多次大败，主队主场进攻前三；用户原文建议极端大球权重上调 5%-10%。该输入必须有带时间来源。

      3. 极端小球：2.5 小球长期不高于 0.55、双方进攻低效且防守型、杯赛首回合或保级战；用户原文给出 0-1 球候选。'
required_inputs:
- human_review
