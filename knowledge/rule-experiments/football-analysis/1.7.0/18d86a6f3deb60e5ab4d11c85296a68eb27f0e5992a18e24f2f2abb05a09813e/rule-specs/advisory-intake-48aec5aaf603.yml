    question: '- 满足 “标准持续” 即可触发对应规则，调整幅度与原规则一致；

      - 若不满足持续标准（震荡走势，节点同向占比＜75% 或反向波动超阈值），即使首尾差值达标，也从严降档执行：

      - 原一级调整 → 降为半级调整

      - 原半级调整 → 不予触发'
