evaluator:
  kind: manual_review
  config:
    question: '1. 占多数的主流机构（≥3家）从初始深盘退至浅一级盘口（如1/1.5球退至1球），退盘后上盘水位维持在0.80-0.95中水区间，未出现大幅飙升；

      2. 至少1家头部机构（威廉/立博/Interwet）逆势维持或升至更深一级盘口，且对应上盘水位≤0.60（极致低水）；

      3. 浅盘层机构退盘后，下盘水位未出现单边大幅下滑，累计降幅≤0.05，排除真实诱下可能。'
required_inputs:
- human_review
