  source_quote: "1. **盘口时序信号权重永远高于“是否开单关”**\r\n档位升降、水位演变、大小球走势是第一判断梯队；\r\n单关开放与否，只能当做**第二层附加参考项**，绝对不能本末倒置。\r\n顺序：亚盘时序＞大小球＞胜平负结构＞单关标识。\r\n\r\n2. 杜绝两种错误思维\r\n❌错误1：只要开单关，直接排除主队；\r\n❌错误2：不开单关就代表强队稳赢；\r\n二者没有绝对因果，只是热度层面的参考线索。\r\n\r\n3. 后续统一执行标准\r\n以后任何比赛，我优先依照【亚盘时序→大小球】主干逻辑分析；\r\n只有你主动问到“单关有什么说法”，我再叠加这条热度维度补充，不会自动嵌入主线推演。"
