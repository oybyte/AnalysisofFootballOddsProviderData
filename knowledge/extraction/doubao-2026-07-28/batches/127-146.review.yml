  source_quote: "1. **档位不能后退**\r\n如果依靠升盘/高水制造阻力，后市绝对不能主动降档、大幅降水。\r\n一旦后退，等于主动拆除自己设置的“阻力”，逻辑自相矛盾，阻盘不成立。\r\n对照赫根本场：初盘0.75，后续降档0.5 → 直接排除任何阻上可能。\r\n\r\n2. **阻力只是“劝退散户”，不会彻底断绝该方向资金**\r\n不会无限拉高水位、无休止升盘。\r\n适度阻力实现筹码均衡；极端拉升一般不是阻盘。\r\n\r\n3. **基本面与盘口方向匹配**\r\n不能出现欧亚严重背离。\r\n胜平负赔率走势不能和亚盘信号反向冲突。"
  normalized_claim: 1. **档位不能后退** 如果依靠升盘/高水制造阻力，后市绝对不能主动降档、大幅降水。 一旦后退，等于主动拆除自己设置的“阻力”，逻辑自相矛盾，阻盘不成立。 对照赫根本场：初盘0.75，后续降档0.5 → 直接排除任何阻上可能。 2. **阻力只是“劝退散户”，不会彻底断绝该方向资金** 不会无限拉高水位、无休止升盘。 适度阻力实现筹码均衡；极端拉升一般不是阻盘。 3. **基本面与盘口方向匹配** 不能出现欧亚严重背离。 胜平负赔率走势不能和亚盘信号反向冲突。
  claim_type: heuristic
