  source_atom_ids:
  - doubao-2026-07-28-text-a00026
  source_quote: "|盘口|解读|赛果结算规则|\r\n|----|----|----|\r\n|平手（0）|双方实力接近，无让球|净胜一球以上→上盘赢；平局/客胜→下盘赢|\r\n|平手/半球（0.25）|主队小幅占优|主胜全赢；平局、客胜全输|\r\n|半球（0.5）|主队需要赢1球才算赢盘|主队净胜≥1球上盘赢；平/负下盘赢|\r\n|半球/一球（0.75）|优势更大|主队净胜2球及以上全赢；净胜1球赢一半；平/负全输|\r\n|一球（1.0）|主队让1球|净胜≥2球上盘赢；净胜1球走水（本金退回）；平/负下盘赢|\r\n|一球/球半（1.25）|净胜2球全赢，净胜1球输一半|\r\n|球半（1.5）|必须净胜2球才算赢盘|"
  normalized_claim: '|盘口|解读|赛果结算规则| |----|----|----| |平手（0）|双方实力接近，无让球|净胜一球以上→上盘赢；平局/客胜→下盘赢| |平手/半球（0.25）|主队小幅占优|主胜全赢；平局、客胜全输| |半球（0.5）|主队需要赢1球才算赢盘|主队净胜≥1球上盘赢；平/负下盘赢| |半球/一球（0.75）|优势更大|主队净胜2球及以上全赢；净胜1球赢一半；平/负全输| |一球（1.0）|主队让1球|净胜≥2球上盘赢；净胜1球走水（本金退回）；平/负下盘赢| |一球/球半（1.25）|净胜2球全赢，净胜1球输一半| |球半（1.5）|必须净胜2球才算赢盘|'
  claim_type: counterexample
