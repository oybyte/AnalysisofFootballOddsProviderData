  source_quote: "博弈最激烈，也是最容易产生诱盘的阶段。临场变动分两类：\r\n① **被动调整**：大量资金集中涌入某一方，机构单纯为平衡筹码、控制赔付被动升降水位/盘口。补充个人观点：大额资本集中进场，有可能直接影响赛场走势（仅个人观点，学术层面无法证实）。\r\n② **主动操盘（诱盘/阻盘）**：机构人为改动指数制造假象。\r\n举例：中盘阶段强队降盘，降低入手门槛，一部分玩家会误认为庄家不看好强队，放弃上盘去往下盘，达到分流热度目的。"
