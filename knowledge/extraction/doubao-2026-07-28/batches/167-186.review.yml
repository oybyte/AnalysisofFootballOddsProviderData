  source_quote: "2. 胜平负\r\n澳、威、英特统一趋势：持续下压主胜赔率，同步抬高平局、客胜赔率。\r\n澳*即时：1.46 / 4.00 / 5.32，重心持续向主队倾斜。\r\n\r\n3. 大小球\r\n澳盘稳固 **2.5/3 档位不变**；威廉维持2.5持续压低大球水位。\r\n总进球合理区间依旧锁定：2～3球，4球以上超大比分支撑不足。\r\n\r\n4. 凯利\r\n多家机构**主胜凯利持续下行**，客胜凯利明显上行；平局凯利小幅抬升，机构防范平局力度减弱。"
  normalized_claim: 2. 胜平负 澳、威、英特统一趋势：持续下压主胜赔率，同步抬高平局、客胜赔率。 澳*即时：1.46 / 4.00 / 5.32，重心持续向主队倾斜。 3. 大小球 澳盘稳固 **2.5/3 档位不变**；威廉维持2.5持续压低大球水位。 总进球合理区间依旧锁定：2～3球，4球以上超大比分支撑不足。 4. 凯利 多家机构**主胜凯利持续下行**，客胜凯利明显上行；平局凯利小幅抬升，机构防范平局力度减弱。
