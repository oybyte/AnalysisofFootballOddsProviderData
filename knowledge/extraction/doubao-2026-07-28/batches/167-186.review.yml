  source_quote: "1. ✅最优剧本（强化我们原有思路，可以坚持下盘主线）\r\n半球档位守住不反弹，上盘水位持续上行，稳定站稳0.95上方。\r\n信号印证诱上风险加剧，全力倾向索尔纳不败。\r\n\r\n2. ⚖️中性拉锯剧本（双方观点各占一半，降低出手力度）\r\n半球不变，水位长期卡在0.86-0.94区间来回震荡，无单向持续涨跌。\r\n盘面辨识度大幅下降，**减小仓位、谨慎观望，不强行主攻方向**。\r\n\r\n3. ⚠️反转剧本（直接放弃原有观点，思路切换）\r\n盘口由半球重新升回半一0.75档位。\r\n证明此前降盘只是短期散热，诱上猜想不成立，重新评估赫根赢盘机会。"
