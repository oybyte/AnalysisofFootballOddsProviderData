  source_quote: "1）盘路结构事实不变：赫根远期给出半一让步，在受注高峰期主动降盘退守半球。\r\n市场最初的预期门槛更高，机构主动下调主队取胜门槛，客观上降低入手赫根的难度，**存在诱上潜在风险，索尔纳不败（下盘）依然是优先方向**。\r\n2）交叉盘逻辑维持：两场同步开赛，罗森博格升盘走强、赫根降盘示弱；历史同结构下，两支主场强队很难同时顺利赢盘，这个框架不作推翻。\r\n3）大小球推演保留：本场倾向进球不会太少，优先3球及以上区间。"
