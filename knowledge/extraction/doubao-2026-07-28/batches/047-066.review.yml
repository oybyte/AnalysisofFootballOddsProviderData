- claim_id: claim-doubao-2026-07-28-text-a01276
  source_atom_ids:
  - doubao-2026-07-28-text-a01276
  source_quote: "1. **FC首尔 1-3 蔚山HD｜盘口：主让0.5半球**\r\n赛果解读：首尔输球，**下盘打出**\r\n回顾盘路特征：\r\n前期0.5持续降水→短暂升0.75半一→又**退盘回落0.5半球+上盘低水0.80**。\r\n结论：这条属于典型【升盘试探、随后退盘诱上】模板。\r\n机构短暂升盘制造主队强势假象，随后降低入手门槛、低水吸引玩家追首尔上盘，最终上盘全输。\r\n⚠️关键教训：热门主队出现「升盘之后主动降档回撤」，诱上风险极高。\r\n\r\n2. **仁川联 1-1 富川FC｜盘口：主让0.75半一**\r\n赛果解读：平局，**上盘全输**\r\n回顾盘路特征：全程死死锁住0.75不变，上盘一路持续降水，自始至终拒绝升盘至1球。\r\n结论：完美契合我们推演的高危模板：**只降水、不升盘，不要盲目追大胜**。\r\n我们当时预判优先级：1球小胜＞平局/客胜＞大胜；本场打出平局，属于上盘最差结局。\r\n本质：持续低水是吸引散户看好仁川主场取胜的陷阱。\r\n\r\n3. **FC光州 1-2 济州SK｜盘口：主让0.5半球**\r\n赛果解读：光州输球，**下盘打出**\r\n回顾盘路特征：水位小幅震荡，欧赔出现分歧，我们提前预判优先关注下盘路线。\r\n验证正确。机构小幅抬升主胜赔率、压低客胜赔率，信号偏向济州不败，最终客胜打出。\r\n\r\n4. **安养FC 2-1 江原FC｜盘口：初盘平半→升盘半球0.5**\r\n赛果解读：安养取胜，**上盘打出**\r\n回顾盘路特征：跨档位跳档升盘，四场不确定性最高，当时建议优先观望。\r\n这条盘路属于【升盘真实阻上】。\r\n初盘倾斜客队，资金流入江原；机构直接升盘抬高门槛，清洗下盘筹码，最终主队取胜。\r\n\U0001F449重点区分：同样是跳档升盘，安养是**一路稳定守住半球不再回撤**；而首尔是升上去又退回来，两者结局完全不同！"
