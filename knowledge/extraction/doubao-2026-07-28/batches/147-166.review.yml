  source_quote: "1. **同型盘**：两场比赛亚盘初始让步形态、操盘演化模板高度相似，但基本面、对阵双方完全独立，资金不存在互相导流，只是盘路结构雷同。\r\n2. **关联盘（联动盘）**：赛事时间同步、热度接近，机构主动利用两场资金互相分流；赔率、水位经常反向调节，一盘受热，另一盘用来承接对冲。\r\n3. **交叉盘**：属于**关联盘的极端子集**。最典型特征：\r\n两场热度强队，盘面走势反向制衡。大众一窝蜂去A强队，机构依靠B盘吸收反向资金；典型形态：一盘升盘造势强队，一盘降档示弱主队，形成资金交叉平衡。"
