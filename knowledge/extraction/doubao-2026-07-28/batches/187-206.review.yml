  source_quote: "先明确核心定义：\r\n**现象：欧赔主胜由2.10附近（201区间）向下走低（看上去看好主队取胜），但是亚盘同一时间，上盘水位不降反升（让球方赔付抬高）。**\r\n对应本场赫根：欧赔主胜2.10→1.80~1.87下行；亚盘半球上盘水位多次冲高。"
