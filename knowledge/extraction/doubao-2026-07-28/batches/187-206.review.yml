  source_quote: "1. **欧亚分歧的本质**\r\n欧赔主胜下行：承认赫根具备拿到3分的能力；\r\n亚盘长期卡死半球0.5档位、上盘水位反复冲高：**机构不相信赫根能够稳定大胜，只认可存在1球优势取胜的可能性。**\r\n半球盘生死规则：赫根净胜≥1球上盘赢；打平/输球下盘赢。\r\n2-1刚好落在「主队赢球、上盘勉强打出」的临界位置，是机构用来分流两边筹码的均衡结果。\r\n\r\n2. **大小球辅助印证**\r\n盘口抬升到3/3.5，机构预期全场总进球≥3球；\r\n直接排除0-0、1-0、0-1这类低比分小球，天然适配2-1、2-2、1-2这类3球格局。\r\n\r\n3. **凯利辅助信号**\r\n主胜凯利持续走高，说明机构并不想全力防守赫根大胜；客胜、平局凯利保持低位，索尔纳拿分（1-2、2-2）同样存在完整支撑。"
