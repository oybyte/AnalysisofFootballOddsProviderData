  source_quote: "1. 基本面评估：双方实力、战意、伤病、交锋、近期状态，估算**理论合理盘口**\r\n2. 舆论评估：判断哪一方天然成为市场热门，弱势方有没有拉力题材\r\n3. 盘口时序分析：初盘定位深浅 → 中盘变动方向 → 临场最终走势，区分主动操盘/被动资金调整\r\n4. 横向交叉验证：亚盘、欧赔、竞彩三者对比，寻找共识或者分歧\r\n5. 额外辅助：留意是否属于交叉/关联特殊盘型\r\n6. 热度判定：识别造热手段，评估大热格局下，存在多大冷门可能性\r\n7. 分歧巨大、信号模糊的比赛，直接选择规避"
