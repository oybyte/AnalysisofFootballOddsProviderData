  source_quote: "1. **初盘阶段（受注开启前）**\r\n无玩家资金介入，依托基本面模型开盘；头部机构初盘就存在预埋诱导意图，不单纯客观反映实力。\r\n2. **中盘阶段（赛前8~10小时，投注高峰前）**\r\n机构观望窗口期：\r\n①盘面长期波动小：要么机构方向清晰、资金流向符合预期；要么机构态度模糊，多体系分歧大建议直接避赛；\r\n②水位、盘口频繁震荡：多见于豪门热门赛事；多次调整后稳定下来的形态，常代表机构中长期立场。\r\n3. **临场盘（赛前1~2小时，开赛之前）博弈最激烈**\r\n变动分为两类：\r\n①被动调整：大额资金涌入，机构被动升降水位平衡赔付；\r\n②主动操盘（诱/阻）：人为制造盘面假象，是多空博弈决胜阶段。"
  normalized_claim: 1. **初盘阶段（受注开启前）** 无玩家资金介入，依托基本面模型开盘；头部机构初盘就存在预埋诱导意图，不单纯客观反映实力。 2. **中盘阶段（赛前8~10小时，投注高峰前）** 机构观望窗口期： ①盘面长期波动小：要么机构方向清晰、资金流向符合预期；要么机构态度模糊，多体系分歧大建议直接避赛； ②水位、盘口频繁震荡：多见于豪门热门赛事；多次调整后稳定下来的形态，常代表机构中长期立场。 3. **临场盘（赛前1~2小时，开赛之前）博弈最激烈** 变动分为两类： ①被动调整：大额资金涌入，机构被动升降水位平衡赔付； ②主动操盘（诱/阻）：人为制造盘面假象，是多空博弈决胜阶段。
