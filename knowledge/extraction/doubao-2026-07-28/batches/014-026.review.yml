  source_quote: "一场比赛成为热门，常见诱因：德比战、球星首秀、换帅、球队连胜/连败关键节点、特殊纪念日等。\r\n普通球迷获取消息大多来自媒体资讯。舆论是机构非常常用的造热工具：赛前通过发布会、消息传闻，定向放出有利于某一方的信息，刻意烘托热度。\r\n玩家必须分辨核心问题：**资讯是客观事实，还是刻意用来造势的素材**。"
