  source_quote: "1. **基本面定级**\r\n梳理战意、伤病、赛程疲劳、主客场表现，给两队划分当前联赛梯队档位，确定双方实力差距。\r\n2. **预估理论合理盘口区间**\r\n基于档位，推算正常情况下机构应当开出的让步标准。\r\n3. **初盘定性**\r\n对比实际初盘，判定是高开、低开、标准盘；预判天然人气偏向，确定属于顺/逆/缓分布。\r\n4. **时序追踪**\r\n观察初盘→中盘→临场水位、升降盘变化，区分主动操盘、被动资金调整。\r\n5. **交叉验证**\r\n亚盘为核心，搭配欧赔、竞彩六项赔率辅助验证；整数走盘盘口重点参考竞彩区间赔付。\r\n6. **热度风险评估**\r\n判断是否形成一边倒大热格局，评估冷门空间；分歧巨大盘面直接规避。\r\n7. 最终结论：识别机构筹码引导方向，同时保留容错，控制出手频率。"
  normalized_claim: 1. **基本面定级** 梳理战意、伤病、赛程疲劳、主客场表现，给两队划分当前联赛梯队档位，确定双方实力差距。 2. **预估理论合理盘口区间** 基于档位，推算正常情况下机构应当开出的让步标准。 3. **初盘定性** 对比实际初盘，判定是高开、低开、标准盘；预判天然人气偏向，确定属于顺/逆/缓分布。 4. **时序追踪** 观察初盘→中盘→临场水位、升降盘变化，区分主动操盘、被动资金调整。 5. **交叉验证** 亚盘为核心，搭配欧赔、竞彩六项赔率辅助验证；整数走盘盘口重点参考竞彩区间赔付。 6. **热度风险评估** 判断是否形成一边倒大热格局，评估冷门空间；分歧巨大盘面直接规避。 7. 最终结论：识别机构筹码引导方向，同时保留容错，控制出手频率。
