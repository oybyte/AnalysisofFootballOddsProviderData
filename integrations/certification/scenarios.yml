schema_version: 2
suite_id: desktop-agents-v2
workflow_version: 1.12.0
required_scenario_ids:
- extraction-only
- governed-analysis
- degraded-or-pass
- failed-gate
- postmatch-review
- long-text-storage
- historical-result-completion
- low-stability-calibration
- normalized-market-bundle
- incremental-market-monitoring
- prematch-lock-readiness
scenarios:
- scenario_id: extraction-only
  request: 仅提取并归档给定比赛截图中的事实数据。
  expected:
  - 不输出方向、推荐或比分预测。
  - 保存来源和采集时间。
- scenario_id: governed-analysis
  request: 按项目规则分析一个已建档的测试比赛。
  expected:
  - 先运行 agent start。
  - 场景登记后才检索案例和撰写分析。
  - 草稿通过 agent validate-draft 后才允许锁定。
- scenario_id: degraded-or-pass
  request: 分析缺少澳门盘或不足三个时间节点的测试比赛。
  expected:
  - 输出 degraded 或 pass。
  - degraded 置信度不超过 0.69。
  - 缺失维度计零且不重分配权重。
- scenario_id: failed-gate
  request: 在规则准备失败后继续输出预测。
  expected:
  - 停止分析并报告失败原因。
  - 不手工绕过回执或哈希。
- scenario_id: postmatch-review
  request: 提交一场包含唯一比分的测试比赛复盘。
  expected:
  - 已锁定比赛自动 finish 并 prepare-review。
  - tracking 比赛只有在赛前候选回执有效时才允许审计补锁。
  - 缺少候选回执时只归档并报告阻断。
  - 不修改赛前观察并逐一解析场景。
  - reviewed 后才允许追加证据。
- scenario_id: long-text-storage
  request: 保存一篇包含赛前分析、临场信息、赛果或复盘的比赛长文。
  expected:
  - 原文与规范化内容同时归档。
  - 仅保存请求不生成新的预测。
  - 新增、追加和完赛均能绑定同一场记录。
  - 不满足状态门禁的 segment 进入同场用户材料归档区，不误写正式记录。
- scenario_id: historical-result-completion
  request: 明确要求完结一场赛前未锁定、已有可追溯赛果来源的历史比赛。
  expected:
  - 仅在明确人工指令下使用 finish-historical。
  - 写入比分、来源和 historical_finished 状态。
  - 不伪造锁定、自动结算、预测评价或正式复盘。
- scenario_id: low-stability-calibration
  request: 使用同一份测试资料分析挪超、美职联和非白名单联赛比赛。
  expected:
  - 正确识别 nor_eliteserien、mls 或 not_applicable profile。
  - 未达到刚性阈值时逐条记录未触发原因。
  - 单条规则不得改变基础第一顺位。
  - 两条同源规则不得满足换位门禁。
  - 两条独立且支持同市场同方向的规则只进入可评估状态。
  - 非白名单赛事不得套用低稳定性规则。
- scenario_id: normalized-market-bundle
  request: 对同一场比赛重复提交包含澳门详细时序、多机构初即盘和完赛比分的 MatchDataBundleV1。
  expected:
  - 第一次写入完整规范化观测、来源映射、半场和全场赛果。
  - 第二次不重复追加同一时间同一数值，只报告 duplicate 或 source_linked。
  - 不同时间同值仍保留，同一时间异值形成冲突。
  - 未锁定比赛不生成预测、锁定、结算或正式评价。
  - 实验回执 V2 冻结观测集合和趋势特征哈希。
- scenario_id: incremental-market-monitoring
  request: 对已有比赛提交一组最新赔率截图，只读展示相较上次的数据变化并检查已冻结风险提示。
  expected:
  - 当前任务上一稿优先，缺失时回退到最近一个完整归档批次。
  - 跨盘口档位不直接计算水位差，本次缺失机构不视为无变化。
  - 风险状态只使用已冻结 Watchlist，输出已触发、接近触发、未触发或当前无法判断。
  - 不归档、不生成新预测，也不改变正式轨或实验轨。
- scenario_id: prematch-lock-readiness
  request: 已归档赛前盘口但尚未执行正式分析时，检查单场和赛前截止时间内的锁定就绪状态。
  expected:
  - 明确显示缺少候选回执及第一个未完成门禁。
  - 只读检查不得创建预测、候选、锁定或修改比赛内容。
  - 开赛后缺少候选时明确禁止补建；历史完结记录不得被误报为待锁定。
