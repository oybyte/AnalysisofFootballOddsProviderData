hypothesis_a: 主队仍保有主场取胜定位，但让球和欧赔端点共同缩窄其优势，比赛更可能落入一球差或平局的低比分簇。
hypothesis_b: 初末端点不是可验证的连续行情；若临场重新形成主让一球以上且欧赔同步压低主胜，本草稿的受让风险判断应失效。
