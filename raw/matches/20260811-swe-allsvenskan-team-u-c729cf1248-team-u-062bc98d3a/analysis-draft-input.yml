schema_version: 2
analysis_input_mode: market_only
baseline_gate:
  facts_status: incomplete
  theoretical_positioning: established
  market_relation: explained_divergence
  decision: degraded
  fact_refs:
    - fact:market-archive-20260810T210400
    - fact:kelly-late-only
  reasons:
    - 缺少澳门亚盘 opening/mid/late 三节点结构化数据，仅能从截图数据提取五节点时序。
    - 未提供可追溯的阵容、伤停与赛程事实；本次仅按盘口材料评估。
    - 凯利指数仅有六家机构即盘快照，无法构建初盘到即盘的完整时序。
score_matrix:
  rows:
    - dimension: asian_handicap_market
      configured_weight: 60
      market_scores:
        one_x_two:
          status: assessed
          scores: {home: -1.0, draw: 0.5, away: 1.0}
        asian_handicap:
          status: assessed
          scores: {home_handicap: -1.0, away_handicap: 1.0}
        fixed_handicap_1x2:
          status: assessed
          scores: {handicap_home: -0.5, handicap_draw: 0.0, handicap_away: 1.0}
        total_goals:
          status: not_applicable
          reason: 让球端点不能单独确定总进球方向。
      fact_refs: [fact:asian-handicap-endpoints]
      rule_ids: [deep-line-stable-cover-v1, trend-purity-v1, provider-consensus-divergence-v1]
      supporting_evidence:
        - 澳门五节点时序：初盘-0.5客水0.79 → 即盘-0.5/1客水0.84，升盘0.25档且客水净升0.05。
        - 升盘节点（08-10 15:58）主水0.82→客水0.96，随后水位逐步回调至客水0.84，形成"升盘→降客水"的经典格局。
        - 四家机构中三家（澳门、bet365、威廉希尔）一致升盘至-0.5/1，机构共识度3/4。
        - 客让半一在瑞典超属于深度让步，表达机构对客队的强力支持。
      counter_evidence:
        - Interwetten 未升盘，维持-0.5且客水从0.80降至0.70，未跟进升盘表示对客队大胜信心不足。
        - 澳门升盘后主水从0.82升至0.94（+0.12），偏高主水暗示客队方向存在阻力。
        - 澳门盘中升盘时客水0.96为高水，后续回调至0.84，升盘过程并非一帆风顺。
      source_provider_ids: [macau, bet365, william-hill, interwetten]
      source_snapshot_ids: [market-vasteras-ah-macau-opening, market-vasteras-ah-macau-mid1, market-vasteras-ah-macau-mid2, market-vasteras-ah-macau-mid3, market-vasteras-ah-macau-late, market-vasteras-ah-bet365-opening, market-vasteras-ah-bet365-late, market-vasteras-ah-william-opening, market-vasteras-ah-william-late, market-vasteras-ah-interwetten-opening, market-vasteras-ah-interwetten-late]
    - dimension: european_odds
      configured_weight: 20
      market_scores:
        one_x_two:
          status: assessed
          scores: {home: -1.0, draw: 0.5, away: 1.0}
        asian_handicap:
          status: not_applicable
          reason: 欧赔仅作胜平负交叉验证，不替代让球盘判断。
        fixed_handicap_1x2:
          status: not_applicable
          reason: 未提供独立固定让球胜平负盘口。
        total_goals:
          status: not_applicable
          reason: 欧赔端点不能单独确定总进球方向。
      fact_refs: [fact:european-odds-endpoints]
      rule_ids: [hidden-draw-away-cut-v1, cross-dimension-netting-v1]
      supporting_evidence:
        - 客胜赔率集中在1.64-1.75极窄区间，机构间分歧极小。
        - 五家有初盘数据的机构客胜赔率全面下降（降幅-0.06至-0.17），方向完全一致。
        - 主胜赔率全面上升（+0.30至+0.80），机构对主队取胜信心持续削弱。
        - 平局赔率同样上升（+0.10至+0.30），与客胜方向一致。
      counter_evidence:
        - Betfair 客胜赔率维持在1.75未变，是唯一未降客胜的机构，存在局部背离。
        - 澳门平赔从3.73升至3.90（+0.17），升幅较大，可能隐含隐藏平局风险。
        - bet365 缺少欧赔初盘数据，仅能验证即盘方向。
      source_provider_ids: [macau, william-hill, ladbrokes, interwetten, betfair, bet365]
      source_snapshot_ids: [market-vasteras-euro-macau-opening, market-vasteras-euro-macau-late, market-vasteras-euro-william-opening, market-vasteras-euro-william-late, market-vasteras-euro-ladbrokes-opening, market-vasteras-euro-ladbrokes-late, market-vasteras-euro-interwetten-opening, market-vasteras-euro-interwetten-late, market-vasteras-euro-betfair-opening, market-vasteras-euro-betfair-late, market-vasteras-euro-bet365-late]
    - dimension: kelly_index
      configured_weight: 15
      market_scores:
        one_x_two:
          status: assessed
          scores: {home: -0.5, draw: 0.0, away: 0.5}
        asian_handicap:
          status: not_applicable
          reason: 凯利指标不能替代亚洲让球方向。
        fixed_handicap_1x2:
          status: not_applicable
          reason: 凯利指标未提供固定让球胜平负对应值。
        total_goals:
          status: not_applicable
          reason: 凯利指标不用于直接判定总进球方向。
      fact_refs: [fact:kelly-endpoints]
      rule_ids: [draw-kelly-parity-v1, single-kelly-value-guard-v1]
      supporting_evidence:
        - 客胜凯利集中在0.89-0.95区间，六家机构均在合理区间内，未出现异常高值。
        - 六家平均客胜凯利从0.98降至0.92（-0.06），客胜方向风险持续降低。
        - 六家平均主胜凯利从0.81升至0.95（+0.14），主胜方向风险显著上升。
        - 澳门即盘客胜凯利0.89为最低值，与澳门亚盘客水0.84形成呼应。
      counter_evidence:
        - Interwetten 客胜凯利0.94偏高，接近预警线。
        - Betfair 主胜凯利1.05 > 1.0，触发单点凯利警戒。
        - 平局凯利跨度0.89-1.02，差值0.13 > 0.05阈值，不满足 draw-kelly-parity 触发条件。
        - 36* 主胜凯利1.04 > 1.0，同样触发警戒。
      source_provider_ids: [macau, bet365, william-hill, ladbrokes, interwetten, betfair]
      source_snapshot_ids: [market-vasteras-kelly-macau-late, market-vasteras-kelly-bet365-late, market-vasteras-kelly-william-late, market-vasteras-kelly-ladbrokes-late, market-vasteras-kelly-interwetten-late, market-vasteras-kelly-betfair-late]
    - dimension: total_goals_market
      configured_weight: 5
      market_scores:
        one_x_two:
          status: not_applicable
          reason: 大小球端点不能单独判定胜平负。
        asian_handicap:
          status: not_applicable
          reason: 大小球端点不能替代亚洲让球方向。
        fixed_handicap_1x2:
          status: not_applicable
          reason: 大小球端点不能判定固定让球胜平负。
        total_goals:
          status: assessed
          scores: {over: 0.0, under: 0.0}
      fact_refs: [fact:total-goals-endpoints]
      rule_ids: [total-goals-cross-market-v1]
      supporting_evidence:
        - 澳门和bet365开出3球盘口，立博、威廉希尔、Interwetten开出2.5球盘口，机构间存在档位分歧。
        - 澳门3球盘口大球水0.80偏低，表达大球方向倾向。
        - bet365 3球盘口大球水0.90、小球水0.90平衡。
      counter_evidence:
        - 立博、威廉希尔、Interwetten 2.5球盘口小球水1.30-1.37极高，表达对小球方向的赔付保护。
        - 盘口档位分歧（2.5 vs 3）表明总进球预期不确定性高，信号强度弱。
        - 立博2.5档位大球水0.53极低，可能鼓励大球方向下注，与3球档位机构信号不一致。
      source_provider_ids: [macau, bet365, ladbrokes, william-hill, interwetten]
      source_snapshot_ids: [market-vasteras-total-macau-opening, market-vasteras-total-macau-late, market-vasteras-total-bet365-opening, market-vasteras-total-bet365-late, market-vasteras-total-ladbrokes-opening, market-vasteras-total-ladbrokes-late, market-vasteras-total-william-opening, market-vasteras-total-william-late, market-vasteras-total-interwetten-opening, market-vasteras-total-interwetten-late]
baseline_output:
  asian_line_display: 客让半一
  asian_home_line: 0.75
  fixed_handicap_home_line: 1
  fixed_handicap_source_type: derived_from_asian_handicap
total_goals:
  status: assessed
  side: over
fact_refs:
  - fact:market-archive-20260810T210400
  - fact:asian-handicap-endpoints
  - fact:european-odds-endpoints
  - fact:kelly-endpoints
  - fact:total-goals-endpoints
  - fact:betfair-exchange-endpoints
hypothesis_a: 澳门五节点"升盘→降客水"路径是机构对客队信心增强的经典信号，3/4机构一致升盘至客让半一，欧赔客胜方向全面下降，必发85%资金集中于客胜，客队穿盘（净胜≥1球）是最可能的剧本，参考比分0-2或1-2。
hypothesis_b: Interwetten未跟进升盘维持-0.5，且必发客胜冷热指数56显示市场过热，若临场澳门客水回升至0.90以上或盘口回退至-0.5，客队可能赢球不穿盘（1球小胜或平局）；微雨天气和场地积水可能影响客队技术发挥，增加不确定性。