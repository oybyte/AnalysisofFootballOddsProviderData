    supporting_evidence:
    - 澳门五节点时序：初盘-0.5客水0.79 → 即盘-0.5/1客水0.84，升盘0.25档且客水净升0.05。
    - 升盘节点（08-10 15:58）主水0.82→客水0.96，随后水位逐步回调至客水0.84，形成"升盘→降客水"的经典格局。
    - 四家机构中三家（澳门、bet365、威廉希尔）一致升盘至-0.5/1，机构共识度3/4。
    - 客让半一在瑞典超属于深度让步，表达机构对客队的强力支持。
    counter_evidence:
    - Interwetten 未升盘，维持-0.5且客水从0.80降至0.70，未跟进升盘表示对客队大胜信心不足。
    - 澳门升盘后主水从0.82升至0.94（+0.12），偏高主水暗示客队方向存在阻力。
    - 澳门盘中升盘时客水0.96为高水，后续回调至0.84，升盘过程并非一帆风顺。
