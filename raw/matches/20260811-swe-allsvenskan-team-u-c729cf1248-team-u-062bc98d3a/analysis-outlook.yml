    - 客胜赔率集中在1.64-1.75极窄区间，机构间分歧极小。
    - 五家有初盘数据的机构客胜赔率全面下降（降幅-0.06至-0.17），方向完全一致。
    - 主胜赔率全面上升（+0.30至+0.80），机构对主队取胜信心持续削弱。
    - 平局赔率同样上升（+0.10至+0.30），与客胜方向一致。
