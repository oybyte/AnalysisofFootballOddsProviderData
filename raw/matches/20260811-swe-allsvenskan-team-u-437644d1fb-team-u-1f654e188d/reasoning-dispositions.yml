  hypothesis_a: 澳门五节点主水方向为降（0.81→0.80→0.86→0.98→0.78），净降0.03，趋势方向指向主队
  hypothesis_b: 中间节点（08-10 11:51 主水0.86、08-10 13:30 主水0.98）出现两次回升，趋势纯度不是1.0，存在震荡
