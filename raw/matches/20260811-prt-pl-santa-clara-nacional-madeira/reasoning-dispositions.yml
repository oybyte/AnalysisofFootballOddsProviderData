dispositions:
- rule_id: trend-purity-v1
  disposition:
    disposition: adopted
  hypothesis_a: 澳门两节点时序（初盘→即盘）主水从0.84降至0.80，方向一致且无反复，纯度1.0确认主队趋势方向为降主水（支持主队）。
  hypothesis_b: 仅有两节点（初盘、即盘），缺少中盘节点验证，若中盘期间曾出现主水回升，则纯度可能低于阈值，趋势信号不可靠。
  supporting_evidence:
    - feature:trend_purity 纯度 1.0 > 阈值 0.67
    - 澳门主水从 0.84 降至 0.80，方向一致无反复
    - 与 bet365/威廉希尔升盘方向一致
  counter_evidence:
    - 仅有两节点，时序深度不足，纯度可能虚高
    - 缺少中盘节点验证，不能排除盘中曾出现反向波动
  invalidation_condition: 若中盘节点显示主水曾回升至 0.85 以上，则纯度信号失效
  actor: lcz
- rule_id: provider-consensus-divergence-v1
  disposition:
    disposition: adopted
  hypothesis_a: 四家机构方向一致指向主队（澳门降主水、bet365升盘、威廉希尔升盘、Interwetten降主水），有效机构数6家超过阈值2家，机构共识确认主队方向。
  hypothesis_b: 仅澳门、bet365、威廉希尔形成明确的升盘/降主水共识，Interwetten虽降主水但盘口未升，且澳门盘口也未升，机构共识局限于水位层面而非盘口层面。
  supporting_evidence:
    - feature:provider_consensus 有效机构数 6 > 阈值 2
    - bet365 和威廉希尔均从平半升盘至半球
    - Interwetten 主水骤降 0.27
  counter_evidence:
    - 澳门和 Interwetten 盘口未升，共识仅在水位层面
    - bet365/威廉希尔升盘后主水微升，方向不完全理想
  invalidation_condition: 若澳门或 Interwetten 临场盘口回退至平半，则机构共识信号失效
  actor: lcz