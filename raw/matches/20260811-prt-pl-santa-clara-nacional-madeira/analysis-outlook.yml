    supporting_evidence:
    - bet365 和威廉希尔从初盘主让平半升盘至主让半球，实质性升盘 0.25 档，机构对主队赢盘信心增强。
    - Interwetten 同盘主水从 1.10 骤降至 0.83（-0.27），降幅极大，是对主队方向赔付控制的强烈信号。
    - 澳门同盘主水从 0.84 降至 0.80（-0.04），与升盘机构方向一致。
    - 四家机构方向统一：2 家升盘 + 2 家降主水，均指向主队方向。
    counter_evidence:
    - bet365/威廉希尔升盘后主水微升 0.05，非"升盘降主水"的理想格局。
    - 澳门盘口始终未升，维持 0.5 不变，可能对主队大胜信心不足。
    - 升盘后主水 0.85-0.88 偏高，主队方向存在一定阻力。
